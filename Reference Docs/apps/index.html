<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Research Apps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root{
      --bg:#f3f5f6;
      --ink:#1b1d21;
      --muted:#6b7280;
      --card:#ffffff;
      --shadow:0 10px 28px rgba(17,24,39,0.08);
      --radius:20px;
    }

    *{box-sizing:border-box;}
    body{
      margin:0;
      font-family:"Space Grotesk", "Segoe UI", sans-serif;
      color:var(--ink);
      background:
        radial-gradient(1200px 520px at 10% -10%, rgba(6,203,174,0.12), transparent 60%),
        radial-gradient(1200px 520px at 110% 0%, rgba(150,90,219,0.12), transparent 60%),
        var(--bg);
    }

    header{
      padding:34px 28px 8px;
      max-width:1100px;
      margin:0 auto;
    }

    h1{
      margin:0;
      font-size:34px;
      letter-spacing:-0.5px;
    }

    .sub{
      margin-top:6px;
      color:var(--muted);
      font-size:15px;
    }

    .grid{
      max-width:1100px;
      margin:18px auto 40px;
      padding:0 28px 40px;
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
      gap:18px;
    }

    .card{
      display:flex;
      flex-direction:column;
      gap:12px;
      text-decoration:none;
      color:inherit;
      background:var(--card);
      border-radius:var(--radius);
      padding:22px 22px 20px;
      box-shadow:var(--shadow);
      transition:transform .18s ease, box-shadow .18s ease;
      position:relative;
      overflow:hidden;
    }

    .card::after{
      content:"";
      position:absolute;
      inset:auto 0 0 0;
      height:4px;
      background:var(--accent);
      opacity:0.85;
    }

    .card:hover{
      transform:translateY(-4px);
      box-shadow:0 18px 40px rgba(17,24,39,0.12);
    }

    .icon{
      width:64px;
      height:64px;
      border-radius:18px;
      display:grid;
      place-items:center;
      background:color-mix(in srgb, var(--accent) 18%, #ffffff 82%);
      color:var(--accent);
      font-size:30px;
    }

    .title{
      font-size:20px;
      font-weight:700;
      letter-spacing:0.2px;
    }

    .cmd{
      font-size:14px;
      color:var(--muted);
    }

    @media (max-width: 640px){
      header{padding:28px 20px 6px;}
      .grid{padding:0 20px 32px;}
      h1{font-size:28px;}
    }
  </style>
</head>
<body>
  <header>
    <h1>Research Apps</h1>
    <div class="sub">Choose a tool to keep the pipeline moving.</div>
  </header>

  <main class="grid">
    <a class="card" href="10-gatekeeper/index.html" style="--accent:#FCB526;">
      <div class="icon"><i class="fa-solid fa-shield-halved" aria-hidden="true"></i></div>
      <div class="title">Gatekeeper</div>
      <div class="cmd">Ingest transcripts fast</div>
    </a>

    <a class="card" href="20-analyst/index.html" style="--accent:#FF5C5C;">
      <div class="icon"><i class="fa-solid fa-chart-line" aria-hidden="true"></i></div>
      <div class="title">Analyst</div>
      <div class="cmd">Surface key insights</div>
    </a>

    <a class="card" href="30-synthesizer/index.html" style="--accent:#965ADB;">
      <div class="icon"><i class="fa-solid fa-layer-group" aria-hidden="true"></i></div>
      <div class="title">Synthesizer</div>
      <div class="cmd">Synthesize narrative themes</div>
    </a>

    <a class="card" href="40-reporter/40-reporter.md" style="--accent:#F36C21;">
      <div class="icon"><i class="fa-solid fa-file-lines" aria-hidden="true"></i></div>
      <div class="title">Reporter</div>
      <div class="cmd">Generate shareable reports</div>
    </a>

    <a class="card" href="50-designer/index.html" style="--accent:#22D46E;">
      <div class="icon"><i class="fa-solid fa-pen-nib" aria-hidden="true"></i></div>
      <div class="title">Designer</div>
      <div class="cmd">Design experience flows</div>
    </a>
  </main>
</body>
</html>
