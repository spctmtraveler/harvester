<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Harvester v2: The Strict Classifier</title>
    <style>
        :root { --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #c9d1d9; --accent: #238636; --red: #da3633; }
        body { font-family: "Segoe UI", monospace; background: var(--bg); color: var(--text); padding: 20px; max-width: 1200px; margin: 0 auto; }
        h1, h2, h3 { margin-top: 0; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 20px; background: var(--panel); padding: 15px; border-radius: 6px; border: 1px solid var(--border); align-items: center; }
        button { padding: 10px 20px; background: #1f6feb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button.danger { background: var(--red); }
        button.success { background: var(--accent); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: 70vh; }
        .col { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; display: flex; flex-direction: column; overflow: hidden; }
        .col-head { padding: 10px; background: #21262d; border-bottom: 1px solid var(--border); font-weight: bold; }
        .col-body { flex: 1; overflow-y: auto; padding: 10px; font-size: 0.9em; line-height: 1.5; }
        
        .log-item { padding: 5px; border-bottom: 1px solid #333; display: flex; gap: 10px; }
        .timestamp { color: #8b949e; font-family: monospace; min-width: 60px; }
        .tag-badge { background: #238636; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.8em; white-space: nowrap; }
        .tag-noise { background: #333; color: #888; }
        
        #progressBar { height: 4px; background: #238636; width: 0%; transition: width 0.3s; }
        .stats { font-size: 0.8em; color: #8b949e; margin-left: auto; }
    </style>
</head>
<body>

    <div class="toolbar">
        <div>
            <h2>❤️ Harvester v2: Strict Mode</h2>
            <div style="font-size: 0.8em; color: #888;">Forces AI to map data to fixed "Heart Walk" taxonomy.</div>
        </div>
        <div class="stats" id="statusArea">Waiting for file...</div>
    </div>

    <div class="toolbar">
        <input type="file" id="fileInput">
        <button onclick="startHarvest()" id="btnStart" class="success" disabled>▶ Start Processing</button>
        <button onclick="resetDB()" class="danger">⚠ 1. Factory Reset DB</button>
    </div>
    <div id="progressBar"></div>

    <div class="grid">
        <div class="col">
            <div class="col-head">Live Processing Log</div>
            <div class="col-body" id="logArea"></div>
        </div>
        <div class="col">
            <div class="col-head">Accepted Insights (Structured)</div>
            <div class="col-body" id="resultsArea"></div>
        </div>
    </div>

<script type="module">
    import { DBHelper } from "https://happydo.xyz/api_auto_db/db_helper.js";
    import { askAI } from "https://happydo.xyz/api/ailnl.js";

    const APP_NAME = "Interview_Harvester_v1"; // Keeping same DB name so tables exist
    
    // --- 1. THE STRICT TAXONOMY ---
    // The AI MUST choose from these. It cannot invent new ones.
    const MASTER_TAXONOMY = [
        "Board Governance & Recruitment",
        "ELT (Executive Leadership Team)",
        "Chair Recruitment & Engagement",
        "Sponsorship & Corporate Partners",
        "Volunteer Management",
        "Staffing, Training & Culture",
        "Event Logistics & Operations",
        "Technology, Data & Tools",
        "Internal Communications",
        "NOISE" // The trash bin
    ];

    let rawLines = [];
    let isProcessing = false;

    async function init() {
        await DBHelper.init(APP_NAME);
        document.getElementById('fileInput').addEventListener('change', handleFileSelect);
    }

    // --- 2. DB RESET TOOL ---
    window.resetDB = async () => {
        if(!confirm("ARE YOU SURE? This will wipe the database clean to start fresh.")) return;
        document.getElementById('statusArea').innerText = "Wiping DB...";
        await DBHelper.query(APP_NAME, "DELETE FROM sentences");
        await DBHelper.query(APP_NAME, "DELETE FROM insights");
        alert("Database Wiped. Ready for fresh import.");
        location.reload();
    };

    // --- 3. FILE PARSER (The Fix for Timestamps) ---
    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            const text = e.target.result;
            parseText(text, file.name);
        };
        reader.readAsText(file);
    }

    function parseText(fullText, fileName) {
        // Regex for timestamps like [12:30] or 12:30
        const timeRegex = /\[?(\d{1,2}:\d{2})\]?/;
        
        // Split by newlines
        const lines = fullText.split(/\r?\n/);
        rawLines = [];
        let lastTimestamp = "00:00"; // Carry-forward logic

        lines.forEach((line, index) => {
            let cleanLine = line.trim();
            if (cleanLine.length < 5) return; // Skip tiny fragments

            // 1. Extract Timestamp
            const match = cleanLine.match(timeRegex);
            let timestamp = lastTimestamp;
            
            if (match) {
                timestamp = match[1]; // Found one!
                lastTimestamp = timestamp; // Update 'current' time
                // Remove timestamp from text so we don't process it as words
                cleanLine = cleanLine.replace(match[0], "").trim();
            }

            // 2. The "Pre-Cleaner" (Regex Filter)
            // Removes: um, uh, ah, like, you know (case insensitive, strict boundaries)
            cleanLine = cleanLine.replace(/\b(um|uh|ah|mm-hmm)\b/gi, ""); 
            cleanLine = cleanLine.replace(/\s+/g, " ").trim(); // Fix double spaces

            if (cleanLine.length > 5) {
                rawLines.push({ 
                    id: index, 
                    text: cleanLine, 
                    timestamp: timestamp, 
                    file: fileName 
                });
            }
        });

        document.getElementById('statusArea').innerText = `Loaded ${rawLines.length} clean lines. Ready.`;
        document.getElementById('btnStart').disabled = false;
        log(`File loaded. Found ${rawLines.length} sentences. Filler words removed.`);
    }

    // --- 4. THE HARVESTER LOOP ---
    window.startHarvest = async () => {
        isProcessing = true;
        document.getElementById('btnStart').disabled = true;
        const BATCH_SIZE = 15; // Small batch for precision

        for (let i = 0; i < rawLines.length; i += BATCH_SIZE) {
            const batch = rawLines.slice(i, i + BATCH_SIZE);
            updateProgress(i, rawLines.length);

            // Save raw lines to DB first (for posterity)
            // Note: We skip this step in code for speed, but usually you'd INSERT into 'sentences' here
            
            await processBatch(batch);
            
            // Artificial delay to be nice to the API
            await new Promise(r => setTimeout(r, 500));
        }
        
        document.getElementById('statusArea').innerText = "Processing Complete!";
        alert("Harvest Complete.");
    };

    async function processBatch(batch) {
        // Construct the prompt
        const batchText = batch.map(b => `ID ${b.id} [${b.timestamp}]: ${b.text}`).join("\n");
        
        const prompt = `
        You are a Strict Data Classifier for the "Heart Walk" project.
        
        TASK:
        Classify each sentence below into exactly ONE of the allowed Taxonomy Categories.
        
        ALLOWED TAXONOMY (Strict List):
        ${JSON.stringify(MASTER_TAXONOMY)}

        RULES:
        1. If a sentence is filler, operational talk (mic check), pleasantries, or vague, label it "NOISE".
        2. Do NOT invent new tags. Use the list exactly.
        3. Return JSON only.
        
        INPUT DATA:
        ${batchText}

        OUTPUT JSON FORMAT:
        [ { "id": 123, "timestamp": "04:00", "tag": "Category Name", "summary": "One sentence summary of content" } ]
        `;

        try {
            const response = await askAI(prompt, "gpt-4o-mini"); // using mini for speed/cost
            const jsonMatch = response.match(/\[[\s\S]*\]/);
            if(jsonMatch) {
                const results = JSON.parse(jsonMatch[0]);
                saveResults(results, batch);
            }
        } catch (e) {
            console.error("Batch Error", e);
            log(`Error on batch: ${e.message}`);
        }
    }

    async function saveResults(results, originalBatch) {
        const resultsArea = document.getElementById('resultsArea');
        const logArea = document.getElementById('logArea');

        for (let r of results) {
            // Find original text for context
            const origin = originalBatch.find(b => b.id === r.id);
            const originalText = origin ? origin.text : "";

            // VISUAL LOGGING
            if (r.tag === "NOISE") {
                logArea.innerHTML = `<div class="log-item" style="opacity:0.5"><span class="timestamp">${r.timestamp}</span><span class="tag-badge tag-noise">NOISE</span> <span>${originalText.substring(0, 50)}...</span></div>` + logArea.innerHTML;
            } else {
                // IT'S A KEEPER!
                resultsArea.innerHTML = `<div class="log-item"><span class="timestamp">${r.timestamp}</span><div><span class="tag-badge">${r.tag}</span><br>${r.summary}</div></div>` + resultsArea.innerHTML;
                
                // SAVE TO DB
                // We save the 'tag' as the topic, and we also save 'master_theme' as the same thing for compatibility
                const safeSum = r.summary.replace(/'/g, "''");
                const safeTag = r.tag.replace(/'/g, "''");
                const safeQuote = originalText.replace(/'/g, "''");
                
                const sql = `INSERT INTO insights (source_id, topic, master_theme, summary, quote, status) VALUES (${r.id}, '${safeTag}', '${safeTag}', '${safeSum}', '${safeQuote}', 'accepted')`;
                await DBHelper.query(APP_NAME, sql);
            }
        }
    }

    function log(msg) {
        const d = document.getElementById('logArea');
        d.innerHTML = `<div style="padding:5px; color:#666;">${msg}</div>` + d.innerHTML;
    }

    function updateProgress(current, total) {
        const pct = Math.round((current / total) * 100);
        document.getElementById('progressBar').style.width = pct + "%";
        document.getElementById('statusArea').innerText = `Processing... ${pct}%`;
    }

    init();
</script>
</body>
</html>
